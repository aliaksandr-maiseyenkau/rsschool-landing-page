<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee House</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-menu">
                <div class="logo">
                    <p>Resource Coffee House</p>
                </div>
                <nav class="nav">
                    <ul class="nav-list">
                        <li class="menu-item">Favorite Coffee</li>
                        <li class="menu-item">About</li>
                        <li class="menu-item">Mobile App</li>
                        <li class="menu-item">Contact Us</li>
                    </ul>
                </nav>
                <div class="header-actions">
                    <div class="theme-switch">theme-switch</div>
                    <div class="coffee-menu">Menu</div>
                </div>
            </div>
        </div>
       
        <div class="hero">
            <div class="container"></div>
        </div>
    </header>
    <main class="main">
        <div class="favorite-coffee">
            <div class="container">
                <p>Choose your favorite coffee</p>
                <div class="slider"></div>
            </div>
        </div>
        <div class="about"></div>
        <div class="mobile-app"></div>
    </main>
    <footer class="contacts"></footer>
</body>
</html>
